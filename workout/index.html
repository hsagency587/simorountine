<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout</title>
<!-- L'app dei workout dentro la tendina della Routine: la Routine la carica in
     una cornice, e le passa i dati. Aperta da sola torna alla Routine. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<!-- il tema e' quello della Routine: si prende prima di disegnare; quando
     cambia, lo rimette la Routine -->
<script>
  try {
    if (parent.document.documentElement.dataset.theme === 'light') document.documentElement.dataset.theme = 'light';
  } catch (e) { /* si resta scuri */ }
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body class="in-routine">

<!-- Niente testata: titolo, Save e impostazioni li ha la Routine. -->
<main class="pagina" id="wlist"></main>

<!-- Il pannello dei gruppi di una scheda: le pastiglie in alto dicono quali
     gruppi ci sono, sotto si lavora su quello scelto. Tutto si salva al volo. -->
<dialog class="chiusura" id="gruppo" tabindex="-1" aria-labelledby="gruppoTit">
  <form method="dialog" class="chiusura-box" id="gruppoForm">
    <h2 class="chiusura-tit" id="gruppoTit">Groups</h2>

    <div class="chips gchips" id="gElenco"></div>

    <div id="gCorpo" hidden>
      <div class="gtesta">
        <input class="campo" id="gNome" type="text" maxlength="40" autocomplete="off"
               placeholder="group name" aria-label="Group name">
        <select class="campo gsel" id="gDentro" aria-label="Inside which group"></select>
      </div>

      <!-- il tipo del gruppo: con Tabata ed EMOM il timer sa esattamente cosa fare -->
      <p class="commento-lab">Type</p>
      <div class="chips" id="gTipo">
        <button type="button" class="chip" data-gtipo="">Normal</button>
        <button type="button" class="chip" data-gtipo="tabata">Tabata</button>
        <button type="button" class="chip" data-gtipo="emom">EMOM</button>
      </div>
      <p class="nota gconsiglio" id="gConsiglio" hidden></p>
      <div class="gtipo-campi" id="gTabata" hidden>
        <label class="gnum"><span>Work</span><input class="campo" id="gLav" type="number" inputmode="numeric" min="1" max="600"><span>sec</span></label>
        <label class="gnum"><span>Rest</span><input class="campo" id="gRec" type="number" inputmode="numeric" min="0" max="600"><span>sec</span></label>
        <label class="gnum"><span>Rounds</span><input class="campo" id="gGiri" type="number" inputmode="numeric" min="0" max="99" placeholder="∞"><span>times the whole group</span></label>
      </div>
      <div class="gtipo-campi" id="gEmom" hidden>
        <label class="gnum"><span>Total</span><input class="campo" id="gMin" type="number" inputmode="numeric" min="0" max="180" placeholder="∞"><span>minutes</span></label>
        <div id="gAlt"></div>
      </div>
      <p class="nota gtimer" id="gTimerNota" hidden></p>

      <p class="commento-lab">What goes in</p>
      <div class="glista" id="gLista"></div>

      <div class="wrow gnuovo">
        <input class="wcampo" id="gNuovoEs" type="text" maxlength="60" placeholder="new exercise">
        <input class="wcampo" id="gNuovoQ" type="text" maxlength="60" placeholder="how much">
        <button type="button" class="schbtn" id="gNuovoOk">add</button>
      </div>

      <button type="button" class="btn btn-del btn-largo" id="gElimina">Delete this group</button>
    </div>

    <div class="chiusura-btn">
      <button type="submit" class="btn btn-ok" value="ok">Done</button>
    </div>
  </form>
</dialog>

<!-- La descrizione di un esercizio: si apre a tutto schermo, con il testo
     grande, perche' e' fatta per essere letta mentre ci si allena. Un link
     scritto da solo su una riga diventa un video. Qui si legge e basta: si
     scrive nell'editor. -->
<dialog class="descbox" id="descrizione" aria-labelledby="descTit">
  <div class="descbox-in">
    <h2 class="desctit" id="descTit"></h2>
    <!-- ripetizioni, tempi e gruppo, per esteso; accanto, quando sono tempi
         veri, il tasto che fa partire il timer -->
    <div class="descqta-riga" id="descQtaRiga">
      <p class="descqta" id="descQta" hidden></p>
      <button type="button" class="tavvia" id="tAvvia" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="14" r="8"/><path d="M12 14V10M9 2h6M12 2v4M19 7l1.5-1.5"/></svg>
        <span id="tAvviaTxt">Start</span>
      </button>
    </div>
    <!-- Lo slot del video: sempre orizzontale, in cima. Play, audio e
         schermo intero dai comandi del video; girando il telefono va a schermo intero. -->
    <div class="vslot" id="vSlot" hidden>
      <video id="vVideo" controls playsinline preload="metadata" muted hidden></video>
      <p class="vstato" id="vStato"></p>
      <!-- con piu' video: un avviso sopra il primo, che sparisce al tocco -->
      <p class="vavviso" id="vAvviso" hidden></p>
    </div>
    <div class="vnav" id="vNav" hidden>
      <button type="button" class="vnav-btn" id="vPrima" aria-label="Previous video">&lsaquo;</button>
      <span class="vnav-conta" id="vConta"></span>
      <button type="button" class="vnav-btn" id="vDopo" aria-label="Next video">&rsaquo;</button>
    </div>
    <div class="desctesto" id="descTesto"></div>
    <div class="chiusura-btn">
      <button type="button" class="btn" id="descChiudi">Close</button>
    </div>
  </div>
  <!-- Il timer: copre la descrizione finche' corre. Numeri grandi, da leggere
       col telefono per terra. Stop torna alla descrizione. -->
  <div class="tmr" id="tmr" hidden>
    <p class="tmr-fase" id="tmrFase"></p>
    <p class="tmr-nome" id="tmrNome"></p>
    <p class="tmr-tempo" id="tmrTempo" role="timer"></p>
    <p class="tmr-info" id="tmrInfo"></p>
    <div class="chiusura-btn tmr-btn">
      <button type="button" class="btn" id="tmrPausa">Pause</button>
      <button type="button" class="btn btn-del" id="tmrStop">Stop</button>
    </div>
  </div>
</dialog>

<!-- L'editor: una schermata a parte. A sinistra l'elenco, a destra la
     pagina; sul telefono uno dopo l'altra. Mentre e' aperto la tendina della
     Routine prende tutto lo schermo. -->
<div class="ed" id="ed" hidden role="dialog" aria-modal="true" aria-labelledby="edTit">
  <header class="ed-top">
    <button type="button" class="ed-indietro" id="edIndietro" aria-label="Back to the list">&lsaquo;</button>
    <h2 class="ed-tit" id="edTit">Editor</h2>
    <span class="ed-stato" id="edStato"></span>
    <button type="button" class="salva" id="edSalva" hidden>Save</button>
    <button type="button" class="schbtn" id="edChiudi">Close</button>
  </header>
  <div class="ed-corpo">
    <nav class="ed-nav" id="edNav" aria-label="What to edit"></nav>
    <section class="ed-pane" id="edPane"></section>
  </div>
</div>

<script src="dati.js"></script>
<script src="app.js"></script>
<script src="editor.js"></script>
</body>
</html>
